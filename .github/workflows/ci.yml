name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.3"
  RUFF_VERSION: "0.17.0"
  NINJA_VERSION: "1.13.2"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10
      - name: clang-format (engine, plugin)
        run: |
          files=$(git ls-files 'engine/*.h' 'engine/*.cpp' 'plugin/*.h' 'plugin/*.cpp')
          if [ -n "$files" ]; then
            uvx "clang-format@${CLANG_FORMAT_VERSION}" --dry-run --Werror $files
          fi
      - name: ruff
        run: |
          uvx "ruff@${RUFF_VERSION}" check .
          uvx "ruff@${RUFF_VERSION}" format --check .

  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: python -m pip install "ninja==$env:NINJA_VERSION"
      - name: Configure
        run: cmake --preset windows-release -DCLAY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release

  macos:
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Ninja
        run: python3 -m pip install --break-system-packages "ninja==${NINJA_VERSION}"
      - name: Configure
        run: cmake --preset macos-release -DCLAY_WARNINGS_AS_ERRORS=ON
      - name: Build
        run: cmake --build --preset macos-release
      - name: Check universal binary
        run: |
          archs=$(lipo -archs build/macos-release/engine/clay_engine_tests)
          echo "archs: $archs"
          echo "$archs" | grep -qw arm64 && echo "$archs" | grep -qw x86_64
      - name: Test (arm64)
        run: ctest --preset macos-release
      # The owner's Mac is Intel, but GitHub's macOS runners are Apple Silicon.
      # Try the Intel slice under Rosetta; if the runner has no Rosetta this step
      # fails without failing the build (see docs/ROADMAP.md "Mac checkpoints").
      - name: Test (x86_64 under Rosetta)
        continue-on-error: true
        run: arch -x86_64 build/macos-release/engine/clay_engine_tests
