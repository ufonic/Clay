name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CLANG_FORMAT_VERSION: "23.1.3"
  RUFF_VERSION: "0.17.0"
  NINJA_VERSION: "1.13.2"
  PLUGINVAL_URL: https://github.com/Tracktion/pluginval/releases/download/v1.0.4
  CLAP_VALIDATOR_URL: https://github.com/free-audio/clap-validator/releases/download/0.4.1
  CLAP_VALIDATOR_BUILD: clap-validator-0.4.1-127-g152b982
  # param-conversions crashes inside clap-validator 0.4.1 when a plugin has no
  # parameters ("This is a bug in the validator"). Drop the exclusion once Clay has parameters.
  CLAP_VALIDATOR_EXCLUDE: param-conversions

jobs:
  # Decide whether the C++ jobs need to run: skip them when a PR only touches
  # Python research code, docs, or Markdown (saves ~25 min per PR). Pushes to main
  # always build everything.
  changes:
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.diff.outputs.cpp }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: diff
        shell: bash
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          changed=$(git diff --name-only "origin/${{ github.base_ref }}...HEAD")
          echo "$changed"
          # Anything outside research/, docs/, and Markdown files can affect the C++ build
          # (engine fixtures under engine/ count as C++).
          if echo "$changed" | grep -qvE '^(research/|docs/)|\.md$'; then
            echo "cpp=true" >> "$GITHUB_OUTPUT"
          else
            echo "cpp=false" >> "$GITHUB_OUTPUT"
          fi

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: clang-format (engine, plugin)
        run: |
          files=$(git ls-files 'engine/*.h' 'engine/*.cpp' 'plugin/*.h' 'plugin/*.cpp')
          if [ -n "$files" ]; then
            uvx "clang-format@${CLANG_FORMAT_VERSION}" --dry-run --Werror $files
          fi
      - name: Real-time safety lint
        run: python3 tools/rt_lint.py engine plugin
      - name: ruff
        run: |
          uvx "ruff@${RUFF_VERSION}" check .
          uvx "ruff@${RUFF_VERSION}" format --check .

  python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.2.0
      - name: Install research environment
        run: uv sync --project research --locked
      - name: pytest (dataset tests skip when data isn't downloaded)
        run: uv run --project research pytest research tools -rs

  windows:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
      - name: Install Ninja
        run: python -m pip install "ninja==$env:NINJA_VERSION"
      # Compiler cache: unchanged files (most of JUCE) come from the cache instead of
      # being recompiled. Keyed per branch, falling back to main's cache.
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: windows-release
          max-size: 2G
      - name: Configure
        # ccache can't cache MSVC's separate .pdb debug info; embed it in the objects.
        run: >
          cmake --preset windows-release -DCLAY_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
          -DCMAKE_MSVC_DEBUG_INFORMATION_FORMAT=Embedded
      - name: Build
        run: cmake --build --preset windows-release
      - name: Test
        run: ctest --preset windows-release
      - name: Validate VST3 (pluginval, strictness 5)
        shell: bash
        run: |
          curl -sSL -o pluginval.zip "$PLUGINVAL_URL/pluginval_Windows.zip" && unzip -q pluginval.zip
          ./pluginval.exe --strictness-level 5 --validate-in-process --skip-gui-tests             --validate "$ARTEFACTS/VST3/Clay.vst3"
        env:
          ARTEFACTS: build/windows-release/plugin/Clay_artefacts/Release
      - name: Validate CLAP (clap-validator)
        shell: bash
        run: |
          curl -sSL -o cv.zip "$CLAP_VALIDATOR_URL/$CLAP_VALIDATOR_BUILD-windows.zip" && unzip -q cv.zip -d cv
          "$(find cv -name clap-validator.exe | head -1)" validate -x "$CLAP_VALIDATOR_EXCLUDE"             "build/windows-release/plugin/Clay_artefacts/Release/CLAP/Clay.clap"
      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: Clay-windows
          retention-days: 14
          path: |
            build/windows-release/plugin/Clay_artefacts/Release/VST3/
            build/windows-release/plugin/Clay_artefacts/Release/CLAP/
            build/windows-release/plugin/Clay_artefacts/Release/Standalone/

  macos:
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: macos-latest # Apple Silicon
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - name: Install Ninja
        run: python3 -m pip install --break-system-packages "ninja==${NINJA_VERSION}"
      - uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: macos-release
          max-size: 2G
      - name: Configure
        run: >
          cmake --preset macos-release -DCLAY_WARNINGS_AS_ERRORS=ON
          -DCMAKE_C_COMPILER_LAUNCHER=ccache -DCMAKE_CXX_COMPILER_LAUNCHER=ccache
      - name: Build
        run: cmake --build --preset macos-release
      - name: Check universal binary
        run: |
          archs=$(lipo -archs build/macos-release/engine/clay_engine_tests)
          echo "archs: $archs"
          echo "$archs" | grep -qw arm64 && echo "$archs" | grep -qw x86_64
      - name: Test (arm64)
        run: ctest --preset macos-release
      # The owner's Mac is Intel, but GitHub's macOS runners are Apple Silicon,
      # so run the Intel slice under Rosetta.
      - name: Test (x86_64 under Rosetta)
        run: arch -x86_64 build/macos-release/engine/clay_engine_tests
      - name: Ad-hoc sign plugin bundles
        working-directory: build/macos-release/plugin/Clay_artefacts/Release
        run: |
          for b in VST3/Clay.vst3 AU/Clay.component CLAP/Clay.clap Standalone/Clay.app; do
            codesign --force --deep --sign - "$b"
            lipo -archs "$b/Contents/MacOS/"* | grep -qw x86_64
          done
      - name: Validate VST3 (pluginval, strictness 5)
        run: |
          curl -sSL -o pluginval.zip "$PLUGINVAL_URL/pluginval_macOS.zip" && unzip -q pluginval.zip
          pluginval.app/Contents/MacOS/pluginval --strictness-level 5 --validate-in-process             --skip-gui-tests --validate build/macos-release/plugin/Clay_artefacts/Release/VST3/Clay.vst3
      - name: Validate AU (auval)
        run: |
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R build/macos-release/plugin/Clay_artefacts/Release/AU/Clay.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          auval -v aufx Cly1 Clay
      - name: Validate CLAP (clap-validator)
        run: |
          curl -sSL -o cv.zip "$CLAP_VALIDATOR_URL/$CLAP_VALIDATOR_BUILD-macos-universal.zip" && unzip -q cv.zip -d cv
          for t in cv/*.tar.gz; do tar -xzf "$t" -C cv; done  # the macOS zip wraps a tarball
          cvbin=$(find cv -type f -name clap-validator | head -1); chmod +x "$cvbin"
          "$cvbin" validate -x "$CLAP_VALIDATOR_EXCLUDE" build/macos-release/plugin/Clay_artefacts/Release/CLAP/Clay.clap
      # upload-artifact drops file permissions, which breaks .app/.vst3 bundles;
      # ditto-zip each bundle so the owner's Mac gets them intact.
      - name: Package macOS bundles
        working-directory: build/macos-release/plugin/Clay_artefacts/Release
        run: |
          mkdir -p "$GITHUB_WORKSPACE/dist"
          for b in VST3/Clay.vst3 AU/Clay.component CLAP/Clay.clap Standalone/Clay.app; do
            ditto -c -k --keepParent "$b" "$GITHUB_WORKSPACE/dist/$(basename "$b").zip"
          done
      - name: Upload macOS build
        uses: actions/upload-artifact@v7
        with:
          name: Clay-macos-universal
          retention-days: 14
          path: dist/
